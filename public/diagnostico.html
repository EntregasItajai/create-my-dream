<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diagnóstico — Dados salvos neste aparelho</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:16px; background:#0f172a; color:#e2e8f0;
         font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size:19px; margin:0 0 4px; color:#22c55e; }
  p.sub { margin:0 0 20px; color:#94a3b8; font-size:13px; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:10px;
          padding:14px; margin-bottom:12px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:#38bdf8; text-transform:uppercase;
             letter-spacing:.5px; }
  .ok { color:#22c55e; font-weight:700; }
  .vazio { color:#f59e0b; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:6px 4px; border-bottom:1px solid #334155; vertical-align:top; }
  td.k { color:#94a3b8; word-break:break-all; }
  td.v { text-align:right; white-space:nowrap; font-weight:700; }
  button { width:100%; padding:14px; font-size:15px; font-weight:700; border:0;
           border-radius:10px; background:#22c55e; color:#052e16; margin-top:8px; }
  button.sec { background:#334155; color:#e2e8f0; }
  textarea { width:100%; height:180px; margin-top:12px; background:#0b1220;
             color:#cbd5e1; border:1px solid #334155; border-radius:8px; padding:10px;
             font:12px/1.4 ui-monospace, Consolas, monospace; }
  .item { padding:8px 0; border-bottom:1px solid #334155; font-size:13px; }
  .item b { color:#e2e8f0; }
  .item span { color:#94a3b8; }
</style>
</head>
<body>
<h1>Diagnóstico de dados</h1>
<p class="sub">Mostra o que está guardado <b>neste aparelho, neste navegador</b>. Nada é apagado nem enviado.</p>
<div id="saida">Lendo…</div>
<button id="copiar">Copiar tudo para enviar</button>
<button id="ver" class="sec">Mostrar conteúdo bruto</button>
<textarea id="bruto" hidden readonly></textarea>

<script>
(function () {
  var PREFIXOS = ['entregasItajai', 'freightSettings', 'sb-'];
  var chaves = Object.keys(localStorage).filter(function (k) {
    return PREFIXOS.some(function (p) { return k.indexOf(p) === 0; });
  });

  function parse(k) { try { return JSON.parse(localStorage[k]); } catch (e) { return localStorage[k]; } }
  function qtd(v) { return Array.isArray(v) ? v.length : (v && typeof v === 'object' ? Object.keys(v).length : 1); }

  var TROCAS = { moto: 'entregasItajai_trocas_moto', carro: 'entregasItajai_trocas_carro' };
  var html = '';

  Object.keys(TROCAS).forEach(function (veic) {
    var bruto = localStorage.getItem(TROCAS[veic]);
    var lista = bruto ? parse(TROCAS[veic]) : null;
    html += '<div class="card"><h2>Manutenções — ' + veic + '</h2>';
    if (Array.isArray(lista) && lista.length) {
      html += '<p class="ok">' + lista.length + ' registro(s) encontrado(s)</p>';
      lista.slice(0, 40).forEach(function (t) {
        html += '<div class="item"><b>' + (t.item || '?') + '</b> — <span>KM ' +
                (t.kmTroca != null ? t.kmTroca.toLocaleString('pt-BR') : '?') +
                (t.data ? ' · ' + t.data : '') + '</span></div>';
      });
    } else {
      html += '<p class="vazio">' + (bruto === null ? 'Chave não existe neste aparelho' : 'Existe, mas está vazia') + '</p>';
    }
    html += '</div>';
  });

  html += '<div class="card"><h2>Tudo que existe aqui</h2>';
  if (chaves.length) {
    html += '<table>';
    chaves.sort().forEach(function (k) {
      var v = parse(k);
      var n = qtd(v);
      html += '<tr><td class="k">' + k + '</td><td class="v">' +
              (Array.isArray(v) ? n + ' reg.' : (localStorage[k].length + ' car.')) + '</td></tr>';
    });
    html += '</table>';
  } else {
    html += '<p class="vazio">Nenhum dado do app neste navegador.</p>';
  }
  html += '</div>';

  document.getElementById('saida').innerHTML = html;

  var pacote = {};
  chaves.forEach(function (k) { if (k.indexOf('sb-') !== 0) pacote[k] = localStorage[k]; });
  var texto = JSON.stringify(pacote, null, 1);
  document.getElementById('bruto').value = texto;

  document.getElementById('copiar').onclick = function () {
    var ta = document.getElementById('bruto');
    ta.hidden = false; ta.select(); ta.setSelectionRange(0, 999999);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (navigator.clipboard) { navigator.clipboard.writeText(texto).catch(function () {}); }
    this.textContent = ok ? 'Copiado!' : 'Selecione o texto abaixo e copie';
  };
  document.getElementById('ver').onclick = function () {
    var ta = document.getElementById('bruto');
    ta.hidden = !ta.hidden;
  };
})();
</script>
</body>
</html>
